<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSTCRD · Message Request</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; background: #FFF0DA; color: #242424; max-width: 640px; margin: 40px auto; padding: 0 20px; text-align: center; line-height: 1.55; }
    nav { text-align: right; margin-bottom: 40px; }
    a { color: #1262B5; text-underline-offset: 3px; }
    a:hover { color: #084780; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); margin: 0 0 16px; }
    .brand { font-size: 0.85rem; letter-spacing: 0.18em; font-weight: bold; margin-bottom: 18px; }
    .intro { max-width: 480px; margin: 0 auto 28px; }
    #choices { display: flex; justify-content: center; }
    button { font: inherit; font-weight: 600; color: #1262B5; background: transparent; border: 0; padding: 8px 4px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    button:hover:not(:disabled) { color: #084780; }
    button:disabled { color: #888; cursor: not-allowed; text-decoration: none; }
    button:focus-visible, a:focus-visible { outline: 2px solid #1262B5; outline-offset: 4px; }
    #status { margin: 24px auto 0; max-width: 480px; min-height: 1.5em; }
    footer { margin-top: 72px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav><a href="index.html">Create Your Own</a> · <a href="about.html">About</a></nav>
  <main>
    <div class="brand">PSTCRD</div>
    <h1>Message Request</h1>
    <p class="intro" id="description">Someone would like to share a video postcard with you. Please review your request below.</p>
    <div id="choices"></div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <footer><a href="https://www.pstcrd.art">Create Your Own</a></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script>
    const SUPABASE_URL = window.APP_CONFIG?.SUPABASE_URL || 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = window.APP_CONFIG?.SUPABASE_PUBLISHABLE_KEY || 'YOUR_PUBLISHABLE_KEY';
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const action = params.get('action');
    const choices = document.getElementById('choices');
    const status = document.getElementById('status');
    const description = document.getElementById('description');
    const labels = {
      accept: 'Accept this postcard',
      decline: 'Decline this postcard',
      unsubscribe: 'Stop future requests'
    };
    const descriptions = {
      accept: 'Accept this request to receive the video postcard.',
      decline: 'Decline this request if you do not wish to receive the postcard.',
      unsubscribe: 'Choose this option to stop future postcard requests.'
    };

    if (!token || !Object.prototype.hasOwnProperty.call(labels, action)) {
      description.textContent = 'This request could not be opened.';
      status.textContent = 'This consent link is invalid.';
    } else {
      description.textContent = descriptions[action];
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = labels[action];
      button.onclick = async () => {
        button.disabled = true;
        status.textContent = 'Processing...';
        try {
          const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
          const { data, error } = await supabaseClient.functions.invoke('consent', { body: { token, action } });
          if (error) throw error;
          status.textContent = data?.message || 'Done.';
          button.hidden = true;
        } catch (error) {
          console.error(error);
          status.textContent = 'Something went wrong. Please try again.';
          button.disabled = false;
        }
      };
      choices.appendChild(button);
    }
  </script>
</body>
</html>
