<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Consent</title>
  <style>
    body { font-family:sans-serif; max-width:560px; margin:60px auto; padding:0 20px; }
    button { display:block; width:100%; padding:14px; margin:14px 0; font:inherit; cursor:pointer; }
    #status { margin-top:24px; padding:14px; background:#eee; }
  </style>
</head>
<body>
  <h1>Message Request</h1>
  <p>This is the low-fidelity consent test.</p>
  <div id="choices"></div>
  <div id="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script>
    const SUPABASE_URL = window.APP_CONFIG?.SUPABASE_URL || 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = window.APP_CONFIG?.SUPABASE_PUBLISHABLE_KEY || 'YOUR_PUBLISHABLE_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const action = params.get('action');
    const choices = document.getElementById('choices');
    const status = document.getElementById('status');

    const labels = {
      accept: 'Accept this message',
      decline: 'Decline this message',
      unsubscribe: 'Stop future requests'
    };

    if (!token || !labels[action]) {
      status.textContent = 'This consent link is invalid.';
    } else {
      const button = document.createElement('button');
      button.textContent = labels[action];
      button.onclick = async () => {
        button.disabled = true;
        status.textContent = 'Processing...';
        const { data, error } = await supabase.functions.invoke('consent', { body: { token, action } });
        if (error) {
          console.error(error);
          status.textContent = 'Something went wrong.';
          button.disabled = false;
          return;
        }
        status.textContent = data?.message || 'Done.';
      };
      choices.appendChild(button);
    }
  </script>
</body>
</html>
