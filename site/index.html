<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Message Test</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
    label { display:block; margin: 18px 0 6px; }
    input, textarea, button { width:100%; box-sizing:border-box; padding:12px; font:inherit; }
    textarea { min-height:140px; }
    button { margin-top:20px; cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.55; }
    #camera-panel { margin-top:24px; }
    video { width:100%; background:#111; aspect-ratio:4/3; object-fit:cover; }
    #recording-controls { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    #recording-controls button { margin-top:12px; }
    #timer { margin:10px 0 0; font-variant-numeric:tabular-nums; }
    #video-note { margin-top:8px; }
    #status { margin-top:20px; padding:12px; background:#eee; min-height:24px; }
  </style>
</head>
<body>
  <h1>Send a Message</h1>
  <p>Low-fidelity video test. Record a maximum 5-second, low-resolution postcard.</p>

  <form id="message-form">

    <section id="camera-panel">
      <h2>Video postcard</h2>
      <video id="video-preview" playsinline muted></video>
      <div id="recording-controls">
        <button id="record-button" type="button">Start recording</button>
        <button id="retake-button" type="button" disabled>Retake</button>
      </div>
      <p id="timer" aria-live="polite">Maximum recording: 5 seconds</p>
      <p id="video-note">Record a postcard, preview it, then send it through the PSTCRD consent system.</p>
    </section>

    <label for="sender-name">Your name</label>
    <input id="sender-name" name="senderName" required maxlength="100">

    <label for="recipient-email">Recipient email</label>
    <input id="recipient-email" name="recipientEmail" type="email" required maxlength="254">

    <label for="message">Message</label>
    <textarea id="message" name="message" required maxlength="2000"></textarea>

    <button id="send-button" type="submit" disabled>Send postcard</button>
  </form>

  <div id="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  
  <script>
    // Replace these with your Supabase project values.
    const SUPABASE_URL = window.APP_CONFIG?.SUPABASE_URL || 'https://dvflrnxilkiuiyfjzocq.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = window.APP_CONFIG?.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_E7RixObilJ3MYXcH3rTJMw_dZccfbkR';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById('message-form');
    const status = document.getElementById('status');
    const videoPreview = document.getElementById('video-preview');
    const recordButton = document.getElementById('record-button');
    const retakeButton = document.getElementById('retake-button');
    const timer = document.getElementById('timer');
    const sendButton = document.getElementById('send-button');

    const MAX_RECORDING_MS = 5_000;
    let cameraStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordedBlob = null;
    let stopTimeout = null;
    let timerInterval = null;
    let recordingStartedAt = 0;

    function preferredRecorderOptions() {
      const candidates = [
        'video/webm;codecs=vp8,opus',
        'video/webm;codecs=vp9,opus',
        'video/webm',
        'video/mp4'
      ];
      const mimeType = candidates.find(type => MediaRecorder.isTypeSupported(type));
      return {
        ...(mimeType ? { mimeType } : {}),
        videoBitsPerSecond: 750_000
      };
    }

    async function getCamera() {
      if (cameraStream) return cameraStream;
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 640, max: 640 },
          height: { ideal: 480, max: 480 },
          facingMode: 'environment'
        },
        audio: false
      });
      videoPreview.srcObject = cameraStream;
      videoPreview.muted = true;
      videoPreview.controls = false;
      await videoPreview.play();
      return cameraStream;
    }

    function updateTimer() {
      const elapsed = Date.now() - recordingStartedAt;
      const remaining = Math.max(0, MAX_RECORDING_MS - elapsed);
      timer.textContent = `Recording: ${(remaining / 1000).toFixed(1)} seconds remaining`;
    }

    function stopRecording() {
      if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
    }

    recordButton.addEventListener('click', async () => {
      if (mediaRecorder?.state === 'recording') {
        stopRecording();
        return;
      }

      try {
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
          throw new Error('This browser does not support in-browser video recording.');
        }

        const stream = await getCamera();
        recordedChunks = [];
        recordedBlob = null;
        mediaRecorder = new MediaRecorder(stream, preferredRecorderOptions());

        mediaRecorder.addEventListener('dataavailable', event => {
          if (event.data.size > 0) recordedChunks.push(event.data);
        });

        mediaRecorder.addEventListener('stop', () => {
          clearTimeout(stopTimeout);
          clearInterval(timerInterval);
          recordedBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });

          if (videoPreview.src) URL.revokeObjectURL(videoPreview.src);
          videoPreview.pause();
          videoPreview.srcObject = null;
          videoPreview.src = URL.createObjectURL(recordedBlob);
          videoPreview.muted = false;
          videoPreview.controls = true;
          videoPreview.loop = true;
          videoPreview.load();
          videoPreview.play().catch(() => {});

          cameraStream?.getTracks().forEach(track => track.stop());
          cameraStream = null;
          recordButton.disabled = true;
          recordButton.textContent = 'Recording complete';
          retakeButton.disabled = false;
          sendButton.disabled = false;
          timer.textContent = `Recorded ${(recordedBlob.size / 1024 / 1024).toFixed(2)} MB. Maximum length: 5 seconds.`;
        });

        mediaRecorder.start(250);
        recordingStartedAt = Date.now();
        recordButton.textContent = 'Stop recording';
        retakeButton.disabled = true;
        updateTimer();
        timerInterval = setInterval(updateTimer, 100);
        stopTimeout = setTimeout(stopRecording, MAX_RECORDING_MS);
      } catch (error) {
        console.error(error);
        status.textContent = `Camera error: ${error.message}`;
      }
    });

    async function createPosterBlob(videoBlob) {
      const sourceUrl = URL.createObjectURL(videoBlob);
      const sourceVideo = document.createElement('video');
      sourceVideo.src = sourceUrl;
      sourceVideo.muted = true;
      sourceVideo.playsInline = true;
      sourceVideo.preload = 'metadata';

      await new Promise((resolve, reject) => {
        sourceVideo.onloadedmetadata = resolve;
        sourceVideo.onerror = () => reject(new Error('Could not prepare the video poster.'));
      });

      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 480;
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('Could not create the poster image.');

      await new Promise((resolve, reject) => {
        const onSeeked = () => { cleanup(); resolve(); };
        const onError = () => { cleanup(); reject(new Error('Could not read the video frame.')); };
        const cleanup = () => {
          sourceVideo.removeEventListener('seeked', onSeeked);
          sourceVideo.removeEventListener('error', onError);
        };
        sourceVideo.addEventListener('seeked', onSeeked, { once: true });
        sourceVideo.addEventListener('error', onError, { once: true });
        sourceVideo.currentTime = 0;
      });

      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const sourceAspect = sourceVideo.videoWidth / sourceVideo.videoHeight;
      const targetAspect = canvas.width / canvas.height;
      let drawWidth = canvas.width;
      let drawHeight = canvas.height;
      let offsetX = 0;
      let offsetY = 0;
      if (sourceAspect > targetAspect) {
        drawHeight = Math.round(canvas.width / sourceAspect);
        offsetY = Math.round((canvas.height - drawHeight) / 2);
      } else {
        drawWidth = Math.round(canvas.height * sourceAspect);
        offsetX = Math.round((canvas.width - drawWidth) / 2);
      }
      ctx.drawImage(sourceVideo, offsetX, offsetY, drawWidth, drawHeight);

      URL.revokeObjectURL(sourceUrl);
      return await new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Could not create the poster image.')), 'image/jpeg', 0.82);
      });
    }

    retakeButton.addEventListener('click', () => {
      if (videoPreview.src) URL.revokeObjectURL(videoPreview.src);
      videoPreview.pause();
      videoPreview.removeAttribute('src');
      videoPreview.load();
      recordedBlob = null;
      recordedChunks = [];
      retakeButton.disabled = true;
      recordButton.disabled = false;
      recordButton.textContent = 'Start recording';
      sendButton.disabled = true;
      timer.textContent = 'Maximum recording: 5 seconds';
      status.textContent = '';
    });

    async function uploadPostcardAndSend() {
      if (!recordedBlob) throw new Error('Please record a postcard first.');

      const senderName = document.getElementById('sender-name').value.trim();
      const recipientEmail = document.getElementById('recipient-email').value.trim();
      const message = document.getElementById('message').value.trim();
      const videoMimeType = recordedBlob.type || mediaRecorder?.mimeType || 'video/webm';

      status.textContent = 'Preparing secure upload...';
      const posterBlob = await createPosterBlob(recordedBlob);

      const { data: prep, error: prepError } = await supabaseClient.functions.invoke('prepare-message', {
        body: {
          senderName,
          recipientEmail,
          message,
          videoMimeType,
          videoSizeBytes: recordedBlob.size,
          posterSizeBytes: posterBlob.size
        }
      });

      if (prepError) {
        throw new Error(prepError.message || prep?.error || 'Could not prepare the postcard.');
      }

      status.textContent = 'Uploading postcard...';
      const { error: videoUploadError } = await supabaseClient.storage
        .from(prep.bucket)
        .uploadToSignedUrl(prep.videoPath, prep.videoToken, recordedBlob, { contentType: videoMimeType });
      if (videoUploadError) {
        throw new Error(videoUploadError.message || 'Could not upload the video.');
      }

      const { error: posterUploadError } = await supabaseClient.storage
        .from(prep.bucket)
        .uploadToSignedUrl(prep.posterPath, prep.posterToken, posterBlob, { contentType: 'image/jpeg' });
      if (posterUploadError) {
        throw new Error(posterUploadError.message || 'Could not upload the postcard image.');
      }

      status.textContent = 'Sending postcard...';
      const { data, error } = await supabaseClient.functions.invoke('send-message', {
        body: { messageId: prep.messageId }
      });

      if (error) {
        throw new Error(error.message || data?.error || 'Could not send the postcard.');
      }

      return data;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      sendButton.disabled = true;
      try {
        const data = await uploadPostcardAndSend();
        status.textContent = data?.message || 'Postcard submitted.';
        form.reset();
      } catch (error) {
        console.error(error);
        status.textContent = `Something went wrong: ${error.message}`;
        sendButton.disabled = false;
      }
    });
  </script>
</body>
</html>
